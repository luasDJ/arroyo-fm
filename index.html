<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arroyo FM | Radio online</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="Logo de Arroyo FM">
      <div>
        <h1>Arroyo FM</h1>
        <p>Tu radio, tu compañía</p>
      </div>
    </div>
    <a class="admin-link" href="admin.html">Panel admin</a>
  </header>

  <main class="hero">
    <section class="hero-copy">
      <span class="eyebrow">RADIO ONLINE</span>
      <h2>Escucha Arroyo FM estés donde estés.</h2>
      <p>Disfruta de nuestra programación en directo y del AutoDJ cuando estamos fuera de emisión.</p>
    </section>

    <section class="player-card">
      <div class="player-topline">
        <span id="modeBadge" class="status-badge">DIRECTO</span>
        <span id="modeLabel" class="muted">Caster.fm</span>
      </div>
      <div id="playerContainer" class="player-container"></div>
      <p id="playerHint" class="player-hint">Reproductor de Arroyo FM</p>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Arroyo FM</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
