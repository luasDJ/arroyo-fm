
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel | Arroyo FM</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="admin-page">
  <main class="admin-wrap">

    <div class="admin-brand">
      <img
        class="brand-logo admin-logo"
        src="logo.png"
        alt="Logo de Arroyo FM"
      >
    </div>

    <a class="back-link" href="index.html">
      ← Volver a la web pública
    </a>

    <h2>Panel de emisión</h2>
    <p class="admin-intro">Controla qué señal escucha tu audiencia en Arroyo FM.</p>

    <section id="accessPanel" class="admin-panel access-panel">
      <h3>Acceso restringido</h3>
      <p class="notice">Introduce el código para abrir la configuración de emisión.</p>
      <form id="accessForm">
        <div class="form-field">
          <label for="accessCode">Código de acceso</label>
          <input id="accessCode" type="password" inputmode="numeric" pattern="[0-9]{7}" maxlength="7" autocomplete="off" required>
        </div>
        <button type="submit">Acceder al panel</button>
      </form>
      <p id="accessMessage" class="notice"></p>
    </section>

    <section id="settingsPanel" class="admin-panel hidden" aria-hidden="true">
      <h3>Configuración del reproductor</h3>

      <p class="notice">
        Elige qué reproductor quieres mostrar en la web.
      </p>

      <div class="form-field">
        <label for="mode">Fuente activa</label>

        <select id="mode">
          <option value="caster">Caster.fm — Directo</option>
          <option value="gocast">GoCast — AutoDJ</option>
        </select>
      </div>

      <div class="form-field">
        <label for="gocastUrl">URL de GoCast o del reproductor alternativo</label>

        <input id="gocastUrl" type="url" placeholder="https://ejemplo.com/reproductor">
      </div>

      <div class="form-field">
        <label for="gocastType">Tipo de integración</label>

        <select id="gocastType">
          <option value="link">Enlace externo</option>
          <option value="iframe">Iframe</option>
        </select>
      </div>

      <button id="saveBtn">
        Guardar configuración
      </button>

      <p id="saveMessage" class="notice"></p>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
