
<div id="loginBox">
  <h3>Acceso de administrador</h3>

  <p class="notice">
    Introduce la contraseña para acceder al panel.
  </p>

  <label for="password">Contraseña</label>

  <input
    id="password"
    type="password"
    autocomplete="current-password"
  >

  <button id="loginBtn">Entrar</button>

  <p id="loginError" class="error"></p>
</div>
